<script>
(function () {
  var mods = Array.prototype.slice.call(document.querySelectorAll('.modul'));
  if (!mods.length) return;
  var req = mods.filter(function (m) { return !m.hasAttribute('data-optional'); });
  function nr(m) { return m.hasAttribute('data-optional') ? 0 : req.indexOf(m) + 1; }
  var key = 'modul-fortschritt:' + location.pathname.replace(/[^\/]*$/, '');
  var done = {};
  try { done = JSON.parse(localStorage.getItem(key)) || {}; } catch (e) {}
  function save() { try { localStorage.setItem(key, JSON.stringify(done)); } catch (e) {} }
  function esc(s) { var d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

  var app = document.createElement('div'); app.className = 'modul-app';
  var nav = document.createElement('div'); nav.className = 'modul-nav';
  var main = document.createElement('div'); main.className = 'modul-main';
  mods[0].parentNode.insertBefore(app, mods[0]);
  app.appendChild(nav); app.appendChild(main);
  mods.forEach(function (m) { main.appendChild(m); });

  nav.innerHTML = '<div class="mn-head">Module</div>' +
    '<div class="mn-prog"><div class="mn-bar"><span></span></div><div class="mn-count"></div></div>' +
    '<ol class="mn-list"></ol>' +
    '<button class="mn-reset" type="button">Fortschritt zurücksetzen</button>';
  var list = nav.querySelector('.mn-list');
  var titles = mods.map(function (m, i) { return m.getAttribute('data-titel') || ('Modul ' + (i + 1)); });

  mods.forEach(function (m, i) {
    var li = document.createElement('li');
    li.innerHTML = '<a href="#' + m.id + '"><span class="mn-nr">' + nr(m) + '</span><span class="mn-t">' + esc(titles[i]) + '</span></a>';
    list.appendChild(li);

    var kopf = document.createElement('div'); kopf.className = 'modul-kopf';
    kopf.innerHTML = '<span class="mk-nr">' + (nr(m) ? 'Modul ' + nr(m) + ' von ' + req.length : 'Modul 0 · optional') + '</span><div class="mk-titel">' + esc(titles[i]) + '</div>';
    m.insertBefore(kopf, m.firstChild);
    var ub = Array.prototype.filter.call(m.querySelectorAll('h2'), function (h) { return /^Übung/.test(h.textContent.trim()); })[0];
    if (ub) {
      var ziel = ub.id ? ub : (ub.closest('section[id]') || ub);
      if (ziel.id) kopf.insertAdjacentHTML('beforeend', '<a class="mk-uebung" href="#' + ziel.id + '">Zur Übung ↓</a>');
    }

    var cf = m.querySelector('.checkfragen');
    function teilListe(sel) {
      return Array.prototype.filter.call(m.querySelectorAll(sel), function (h) {
        return (h.id || (h.closest('section[id]') || {}).id) && !h.closest('.callout, .checkfragen') && !/^(Übung|Lösung)/.test(h.textContent.trim());
      });
    }
    var codes = Array.prototype.filter.call(m.querySelectorAll('div.sourceCode pre code, pre.sourceCode code'), function (c) { return c.closest('.cell, .sourceCode') && !c.closest('.cell-output'); });
    if (codes.length) {
      var dl = document.createElement('a'); dl.className = 'mk-skript'; dl.textContent = 'R-Skript ↓';
      dl.download = 'modul-' + nr(m) + '.R';
      dl.addEventListener('click', function () {
        var txt = '# ' + titles[i] + '\n\n' + codes.map(function (c) { return c.textContent.replace(/\s+$/, ''); }).join('\n\n# ----\n\n') + '\n';
        dl.href = URL.createObjectURL(new Blob([txt], { type: 'text/plain' }));
      });
      kopf.appendChild(dl);
    }
    var teile = teilListe('h1');
    if (teile.length < 3) teile = teilListe('h2');
    if (teile.length >= 2) {
      var tn = document.createElement('nav'); tn.className = 'mk-teile';
      tn.innerHTML = '<span>In diesem Modul</span>' + teile.map(function (h, k) {
        var id = h.id || h.closest('section[id]').id;
        return '<a href="#' + id + '"><b>' + (k + 1) + '</b>' + esc(h.textContent.trim()) + '</a>';
      }).join('');
      kopf.parentNode.insertBefore(tn, kopf.nextSibling);
    }
    if (cf) {
      quiz(m, cf);
    }

    var fuss = document.createElement('div'); fuss.className = 'modul-fuss';
    fuss.innerHTML = (i > 0 ? '<a class="mf-prev" href="#' + mods[i - 1].id + '">← ' + esc(titles[i - 1]) + '</a>' : '<span></span>') +
      (i < mods.length - 1 ? '<a class="mf-next" href="#' + mods[i + 1].id + '">' + esc(titles[i + 1]) + ' →</a>' : '<span></span>');
    m.appendChild(fuss);
  });

  function quiz(m, cf) {
    var fr = Array.prototype.slice.call(cf.querySelectorAll('.frage'));
    var kopf = document.createElement('div'); kopf.className = 'cf-kopf';
    kopf.innerHTML = '<b>Checkpoint</b><span>Beantworte ' + (fr.length === 2 ? 'beide Fragen' : 'alle Fragen') + ' richtig, um das Modul abzuschließen.</span>';
    cf.insertBefore(kopf, cf.firstChild);
    fr.forEach(function (q) {
      var ol = q.querySelector('ol'); if (!ol) return;
      var right = parseInt(q.getAttribute('data-richtig'), 10);
      var opts = document.createElement('div'); opts.className = 'cf-opts';
      var fb = document.createElement('div'); fb.className = 'cf-fb';
      Array.prototype.slice.call(ol.children).forEach(function (li, k) {
        var b = document.createElement('button'); b.type = 'button'; b.className = 'cf-opt'; b.innerHTML = li.innerHTML;
        if (k + 1 === right) b.setAttribute('data-ok', '1');
        b.addEventListener('click', function () {
          if (q.classList.contains('ok')) return;
          if (k + 1 === right) {
            q.classList.add('ok'); b.classList.add('richtig'); fb.textContent = 'Richtig!';
            opts.querySelectorAll('button').forEach(function (x) { x.disabled = true; });
            check();
          } else {
            b.classList.add('falsch'); b.disabled = true;
            fb.textContent = 'Leider nicht richtig – schau dir den Abschnitt noch einmal an und versuch es erneut.';
          }
        });
        opts.appendChild(b);
      });
      ol.parentNode.replaceChild(opts, ol);
      q.appendChild(fb);
    });
    var ok = document.createElement('div'); ok.className = 'cf-ok';
    ok.textContent = '✓ Modul abgeschlossen';
    cf.appendChild(ok);
    function check() {
      if (fr.every(function (q) { return q.classList.contains('ok'); })) {
        done[m.id] = true; save(); cf.classList.add('fertig'); update();
      }
    }
    if (done[m.id]) {
      fr.forEach(function (q) {
        q.classList.add('ok');
        q.querySelectorAll('.cf-opt').forEach(function (b) { b.disabled = true; if (b.getAttribute('data-ok')) b.classList.add('richtig'); });
      });
      cf.classList.add('fertig');
    }
  }

  function update() {
    var n = req.filter(function (m) { return done[m.id]; }).length;
    nav.querySelector('.mn-bar span').style.width = (100 * n / req.length) + '%';
    nav.querySelector('.mn-count').textContent = n + ' von ' + req.length + ' Modulen abgeschlossen';
    mods.forEach(function (m, i) { list.children[i].classList.toggle('fertig', !!done[m.id]); });
  }

  function show(idx, el) {
    mods.forEach(function (m, k) { m.classList.toggle('aktiv', k === idx); list.children[k].classList.toggle('aktiv', k === idx); });
    try { localStorage.setItem(key + 'zuletzt', mods[idx].id); } catch (e) {}
    if (el) el.scrollIntoView();
    else window.scrollTo(0, Math.max(0, app.getBoundingClientRect().top + window.pageYOffset - 90));
  }
  function route() {
    var h = decodeURIComponent(location.hash.slice(1));
    if (!h) { try { h = localStorage.getItem(key + 'zuletzt') || ''; } catch (e) {} }
    var el = h ? document.getElementById(h) : null;
    var m = el ? el.closest('.modul') : null;
    if (!m) { if (location.hash && el) return; m = req[0]; el = m; }
    if (!location.hash) history.replaceState(null, '', '#' + m.id);
    show(mods.indexOf(m), el === m ? null : el);
  }
  nav.querySelector('.mn-reset').addEventListener('click', function () {
    if (!confirm('Fortschritt für diesen Workshop wirklich zurücksetzen?')) return;
    try { localStorage.removeItem(key); } catch (e) {}
    location.reload();
  });
  document.addEventListener('click', function (ev) {
    var a = ev.target.closest && ev.target.closest('a[href^="#"]');
    if (!a || ev.defaultPrevented || ev.button !== 0 || ev.metaKey || ev.ctrlKey || ev.shiftKey) return;
    var id = decodeURIComponent(a.getAttribute('href').slice(1));
    var el = id && document.getElementById(id);
    if (!el || !el.closest('.modul') || el.closest('.modul.aktiv') === el.closest('.modul') && el !== el.closest('.modul')) return;
    ev.preventDefault(); ev.stopPropagation();
    history.pushState(null, '', '#' + id);
    route();
  }, true);
  window.addEventListener('hashchange', route);
  window.addEventListener('popstate', route);
  update();
  route();
})();
</script>
