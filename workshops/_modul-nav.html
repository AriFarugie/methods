<script>
(function () {
  var mods = Array.prototype.slice.call(document.querySelectorAll('.modul'));
  if (!mods.length) return;
  var req = mods.filter(function (m) { return !m.hasAttribute('data-optional'); });
  function nr(m) { return m.hasAttribute('data-optional') ? 0 : req.indexOf(m) + 1; }
  var key = 'modul-fortschritt:' + location.pathname.replace(/[^\/]*$/, '');
  var done = {};
  try { done = JSON.parse(localStorage.getItem(key)) || {}; } catch (e) {}
  function save() { try { localStorage.setItem(key, JSON.stringify(done)); } catch (e) {} }
  function esc(s) { var d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

  var app = document.createElement('div'); app.className = 'modul-app';
  var nav = document.createElement('div'); nav.className = 'modul-nav';
  var main = document.createElement('div'); main.className = 'modul-main';
  mods[0].parentNode.insertBefore(app, mods[0]);
  app.appendChild(nav); app.appendChild(main);
  mods.forEach(function (m) { main.appendChild(m); });

  nav.innerHTML = '<div class="mn-head">Module</div>' +
    '<div class="mn-prog"><div class="mn-bar"><span></span></div><div class="mn-count"></div></div>' +
    '<ol class="mn-list"></ol>' +
    '<button class="mn-reset" type="button">Fortschritt zurücksetzen</button>';
  var list = nav.querySelector('.mn-list');
  var titles = mods.map(function (m, i) { return m.getAttribute('data-titel') || ('Modul ' + (i + 1)); });

  var wsTitel = ((document.querySelector('h1.title') || {}).textContent || document.title).trim();
  var gesamt = [];
  var ohneTitel = /^(Alternative|Alles in einem Schritt|Output|Objekte entfernen)/;
  function titelVon(el) {
    var co = el.closest('.callout'), tp = el.closest('.tab-pane'), t = [];
    while (co) {
      var h = co.querySelector('.callout-title-container');
      if (h) t.unshift(h.textContent.trim());
      co = co.parentNode.closest('.callout');
    }
    if (tp) { var a = document.querySelector('[data-bs-target="#' + tp.id + '"], [href="#' + tp.id + '"]'); if (a) t.push(a.textContent.trim()); }
    return t;
  }
  function skriptText(m) {
    var out = [], hs = {}, kontext = '';
    m.querySelectorAll('h1, h2, h3, div.sourceCode pre code, pre.sourceCode code').forEach(function (el) {
      if (/^H\d$/.test(el.tagName)) {
        if (el.closest('.callout, .tab-pane, .checkfragen, .stufe, .tipps')) return;
        var lv = el.tagName === 'H3' ? 3 : 2;
        hs[lv] = { t: el.textContent.trim(), neu: true };
        if (lv === 2) delete hs[3];
        return;
      }
      if (!el.closest('.cell, .sourceCode') || el.closest('.cell-output, .fehler, .raten, .tipp:not(.loesung)')) return;
      var tt = titelVon(el);
      if (tt.some(function (t) { return ohneTitel.test(t); })) return;
      var code = el.textContent.replace(/\s+$/, '');
      if (/___/.test(code)) return;
      [2, 3].forEach(function (lv) {
        if (hs[lv] && hs[lv].neu) { out.push('\n' + (lv === 2 ? '## ' : '### ') + hs[lv].t + ' ----'); hs[lv].neu = false; kontext = ''; }
      });
      var box = el.closest('.jetzt-du, .stufe');
      var bt = box && (box.classList.contains('jetzt-du') ? 'Jetzt du' : box.getAttribute('data-titel'));
      if (bt && /^1 ·/.test(bt)) { bt = ''; box = null; }
      if (bt) tt.unshift(bt);
      if (el.closest('.tipp.loesung') && !tt.some(function (t) { return /^Lösung/.test(t); })) tt.splice(box ? 1 : 0, 0, 'Lösung');
      var k = tt.join(' · ');
      if (k !== kontext) { if (k) out.push('\n# ' + k); kontext = k; }
      out.push((k ? '' : '\n') + code.replace(/^install\.packages\(/gm, '# install.packages('));
    });
    if (!out.length) return '';
    var t = (nr(m) ? 'Modul ' + nr(m) + ': ' : '') + m.getAttribute('data-titel');
    return '\n# ' + t + ' ' + '='.repeat(Math.max(4, 70 - t.length)) + '\n' + out.join('\n') + '\n';
  }
  function gesamtSkript() {
    var txt = gesamt.join('\n'), pk = {};
    txt.replace(/(?:library|install\.packages)\(\s*"?([A-Za-z0-9.]+)"?/g, function (_, p) { pk[p] = 1; });
    var liste = Object.keys(pk).map(function (p) { return '"' + p + '"'; }).join(', ');
    return '# ' + wsTitel + ' – Gesamtskript\n' +
      '# Alle Codebeispiele und empfohlenen Lösungen aus Modul 1–' + req.length + '.\n' +
      '# Abschnitte lassen sich in RStudio über die Gliederung (Strg + Shift + O) ansteuern.\n' +
      (liste ? '#\n# Pakete einmalig installieren:\n# install.packages(c(' + liste + '))\n' : '') + txt;
  }

  mods.forEach(function (m, i) {
    var li = document.createElement('li');
    li.innerHTML = '<a href="#' + m.id + '"><span class="mn-nr">' + nr(m) + '</span><span class="mn-t">' + esc(titles[i]) + '</span></a>';
    list.appendChild(li);

    var kopf = document.createElement('div'); kopf.className = 'modul-kopf';
    kopf.innerHTML = '<span class="mk-nr">' + (nr(m) ? 'Modul ' + nr(m) + ' von ' + req.length : 'Modul 0 · optional') + '</span><div class="mk-titel">' + esc(titles[i]) + '</div>';
    m.insertBefore(kopf, m.firstChild);
    var ub = Array.prototype.filter.call(m.querySelectorAll('h2'), function (h) { return /^Übung/.test(h.textContent.trim()); })[0] || m.querySelector('.schritt.uebung h1, .schritt.uebung h2');
    if (ub) {
      var ziel = ub.id ? ub : (ub.closest('section[id]') || ub);
      if (ziel.id) kopf.insertAdjacentHTML('beforeend', '<a class="mk-uebung" href="#' + ziel.id + '">Zur Übung ↓</a>');
    }

    var cf = m.querySelector('.checkfragen');
    function teilListe(sel) {
      return Array.prototype.filter.call(m.querySelectorAll(sel), function (h) {
        return (h.id || (h.closest('section[id]') || {}).id) && !h.closest('.callout, .checkfragen') && !/^(Übung|Lösung)/.test(h.textContent.trim());
      });
    }
    var skript = skriptText(m);
    if (skript) {
      var dl = document.createElement('a'); dl.className = 'mk-skript'; dl.textContent = 'R-Skript ↓';
      dl.download = 'modul-' + nr(m) + '.R';
      dl.href = URL.createObjectURL(new Blob(['# ' + wsTitel + '\n' + skript], { type: 'text/plain' }));
      kopf.appendChild(dl);
      if (nr(m)) gesamt.push(skript);
    }
    var sch = Array.prototype.filter.call(m.querySelectorAll('.schritt'), function (x) { return x.parentNode.closest('.modul') === m && !x.parentNode.closest('.schritt'); });
    var teile = teilListe('h1');
    if (teile.length < 3) teile = teilListe('h2');
    if (sch.length) schritte(m, kopf, sch);
    else if (teile.length >= 2) {
      var tn = document.createElement('nav'); tn.className = 'mk-teile';
      tn.innerHTML = '<span>In diesem Modul</span>' + teile.map(function (h, k) {
        var id = h.id || h.closest('section[id]').id;
        return '<a href="#' + id + '"><b>' + (k + 1) + '</b>' + esc(h.textContent.trim()) + '</a>';
      }).join('');
      kopf.parentNode.insertBefore(tn, kopf.nextSibling);
    }
    if (cf) {
      quiz(m, cf);
    }

    var fuss = document.createElement('div'); fuss.className = 'modul-fuss';
    fuss.innerHTML = (i > 0 ? '<a class="mf-prev" href="#' + mods[i - 1].id + '">← ' + esc(titles[i - 1]) + '</a>' : '<span></span>') +
      (i < mods.length - 1 ? '<a class="mf-next" href="#' + mods[i + 1].id + '">' + esc(titles[i + 1]) + ' →</a>' : '<span></span>');
    m.appendChild(fuss);
  });

  function schritte(m, kopf, sch) {
    var sk = key + 'schritt:' + m.id, gk = key + 'gesehen:' + m.id, gesehen = {};
    try { gesehen = JSON.parse(localStorage.getItem(gk)) || {}; } catch (e) {}
    var tg = document.createElement('label'); tg.className = 'ms-alle';
    tg.innerHTML = '<input type="checkbox"><span class="ms-sw"></span>Alle Schritte anzeigen';
    tg.querySelector('input').addEventListener('change', function () { alleSchritte(this.checked); });
    var bar = document.createElement('nav'); bar.className = 'ms-bar';
    sch.forEach(function (s, k) {
      var t = s.getAttribute('data-titel') || ('Schritt ' + (k + 1));
      var b = document.createElement('button'); b.type = 'button'; b.className = 'ms-st';
      if (/^Übung/.test(t) || s.classList.contains('uebung')) b.classList.add('uebung');
      else if (s.querySelector('.jetzt-du, .raten, .fehler, .besprechen')) b.classList.add('mitmachen');
      b.innerHTML = '<b>' + (k + 1) + '</b>' + esc(t);
      b.addEventListener('click', function () { zeige(k, true); });
      bar.appendChild(b);
      var nv = document.createElement('div'); nv.className = 'ms-nav';
      nv.innerHTML = (k > 0 ? '<button type="button" class="ms-prev">← ' + esc(sch[k - 1].getAttribute('data-titel') || '') + '</button>' : '<span></span>') +
        (k < sch.length - 1 ? '<button type="button" class="ms-next">Weiter: ' + esc(sch[k + 1].getAttribute('data-titel') || '') + ' →</button>' : '<span></span>');
      var pv = nv.querySelector('.ms-prev'), nx = nv.querySelector('.ms-next');
      if (pv) pv.addEventListener('click', function () { zeige(k - 1, true); });
      if (nx) nx.addEventListener('click', function () { gesehen[k] = 1; zeige(k + 1, true); });
      s.appendChild(nv);
    });
    sch[0].parentNode.insertBefore(bar, sch[0]);
    bar.parentNode.insertBefore(tg, bar);
    function zeige(k, scroll) {
      sch.forEach(function (s, j) { s.classList.toggle('aktiv', j === k); bar.children[j].classList.toggle('aktiv', j === k); bar.children[j].classList.toggle('gesehen', !!gesehen[j] && j !== k); });
      try { localStorage.setItem(sk, k); localStorage.setItem(gk, JSON.stringify(gesehen)); } catch (e) {}
      if (scroll) { if (location.hash.slice(1) !== m.id) history.replaceState(null, '', '#' + m.id); window.scrollTo(0, Math.max(0, bar.getBoundingClientRect().top + window.pageYOffset - 90)); }
    }
    m._zeigeSchritt = function (el) { var s = el.closest('.schritt'); var k = sch.indexOf(s); if (k >= 0) zeige(k, false); };
    var k0 = 0; try { k0 = Math.min(sch.length - 1, parseInt(localStorage.getItem(sk), 10) || 0); } catch (e) {}
    zeige(k0, false);
  }
  function alleSchritte(an) {
    try { localStorage.setItem(key + 'alle', an ? '1' : ''); } catch (e) {}
    mods.forEach(function (x) { x.classList.toggle('alle', an); var c = x.querySelector('.ms-alle input'); if (c) c.checked = an; });
  }

  Array.prototype.forEach.call(document.querySelectorAll('.raten'), function (r) {
    var ol = r.querySelector('ol'); if (!ol) return;
    var right = parseInt(r.getAttribute('data-richtig'), 10);
    var opts = document.createElement('div'); opts.className = 'cf-opts ra-opts';
    var auf = r.querySelector('.aufloesung');
    Array.prototype.slice.call(ol.children).forEach(function (li, k) {
      var b = document.createElement('button'); b.type = 'button'; b.className = 'cf-opt'; b.innerHTML = li.innerHTML;
      b.addEventListener('click', function () {
        opts.querySelectorAll('button').forEach(function (x, j) { x.disabled = true; if (j + 1 === right) x.classList.add('richtig'); });
        if (k + 1 !== right) b.classList.add('falsch');
        if (auf) auf.classList.add('offen');
      });
      opts.appendChild(b);
    });
    ol.parentNode.replaceChild(opts, ol);
  });

  Array.prototype.forEach.call(document.querySelectorAll('.tipps'), function (box) {
    var tt = Array.prototype.filter.call(box.children, function (x) { return x.classList.contains('tipp'); });
    var row = document.createElement('div'); row.className = 'tp-row';
    tt.forEach(function (t, k) {
      var b = document.createElement('button'); b.type = 'button'; b.className = 'tp-btn';
      b.textContent = t.getAttribute('data-titel') || (t.classList.contains('loesung') ? 'Lösung' : 'Tipp ' + (k + 1));
      b.setAttribute('aria-expanded', 'false');
      if (k > 0) b.disabled = true;
      b.addEventListener('click', function () {
        var auf = !t.classList.contains('offen');
        t.classList.toggle('offen', auf); b.classList.toggle('offen', auf); b.setAttribute('aria-expanded', auf);
        if (auf && row.children[k + 1]) row.children[k + 1].disabled = false;
      });
      row.appendChild(b);
    });
    box.insertBefore(row, box.firstChild);
  });

  function quiz(m, cf) {
    var fr = Array.prototype.slice.call(cf.querySelectorAll('.frage'));
    var kopf = document.createElement('div'); kopf.className = 'cf-kopf';
    kopf.innerHTML = '<b>Checkpoint</b><span>Beantworte ' + (fr.length === 2 ? 'beide Fragen' : 'alle Fragen') + ' richtig, um das Modul abzuschließen.</span>';
    cf.insertBefore(kopf, cf.firstChild);
    fr.forEach(function (q) {
      var ol = q.querySelector('ol'); if (!ol) return;
      var right = parseInt(q.getAttribute('data-richtig'), 10);
      var opts = document.createElement('div'); opts.className = 'cf-opts';
      var fb = document.createElement('div'); fb.className = 'cf-fb';
      Array.prototype.slice.call(ol.children).forEach(function (li, k) {
        var b = document.createElement('button'); b.type = 'button'; b.className = 'cf-opt'; b.innerHTML = li.innerHTML;
        if (k + 1 === right) b.setAttribute('data-ok', '1');
        b.addEventListener('click', function () {
          if (q.classList.contains('ok')) return;
          if (k + 1 === right) {
            q.classList.add('ok'); b.classList.add('richtig'); fb.textContent = 'Richtig!';
            opts.querySelectorAll('button').forEach(function (x) { x.disabled = true; });
            check();
          } else {
            b.classList.add('falsch'); b.disabled = true;
            fb.textContent = 'Leider nicht richtig – schau dir den Abschnitt noch einmal an und versuch es erneut.';
          }
        });
        opts.appendChild(b);
      });
      ol.parentNode.replaceChild(opts, ol);
      q.appendChild(fb);
    });
    var ok = document.createElement('div'); ok.className = 'cf-ok';
    ok.textContent = '✓ Modul abgeschlossen';
    cf.appendChild(ok);
    function check() {
      if (fr.every(function (q) { return q.classList.contains('ok'); })) {
        done[m.id] = true; save(); cf.classList.add('fertig'); update();
      }
    }
    if (done[m.id]) {
      fr.forEach(function (q) {
        q.classList.add('ok');
        q.querySelectorAll('.cf-opt').forEach(function (b) { b.disabled = true; if (b.getAttribute('data-ok')) b.classList.add('richtig'); });
      });
      cf.classList.add('fertig');
    }
  }

  function update() {
    var n = req.filter(function (m) { return done[m.id]; }).length;
    nav.querySelector('.mn-bar span').style.width = (100 * n / req.length) + '%';
    nav.querySelector('.mn-count').textContent = n + ' von ' + req.length + ' Modulen abgeschlossen';
    mods.forEach(function (m, i) { list.children[i].classList.toggle('fertig', !!done[m.id]); });
  }

  function show(idx, el) {
    mods.forEach(function (m, k) { m.classList.toggle('aktiv', k === idx); list.children[k].classList.toggle('aktiv', k === idx); });
    try { localStorage.setItem(key + 'zuletzt', mods[idx].id); } catch (e) {}
    if (el && mods[idx]._zeigeSchritt) mods[idx]._zeigeSchritt(el);
    if (el) el.scrollIntoView();
    else window.scrollTo(0, Math.max(0, app.getBoundingClientRect().top + window.pageYOffset - 90));
  }
  function route() {
    var h = decodeURIComponent(location.hash.slice(1));
    if (!h) { try { h = localStorage.getItem(key + 'zuletzt') || ''; } catch (e) {} }
    var el = h ? document.getElementById(h) : null;
    var m = el ? el.closest('.modul') : null;
    if (!m) { if (location.hash && el) return; m = req[0]; el = m; }
    if (!location.hash) history.replaceState(null, '', '#' + m.id);
    show(mods.indexOf(m), el === m ? null : el);
  }
  nav.querySelector('.mn-reset').addEventListener('click', function () {
    if (!confirm('Fortschritt für diesen Workshop wirklich zurücksetzen?')) return;
    try {
      Object.keys(localStorage).forEach(function (k) { if (k === key || k.indexOf(key + 'schritt:') === 0 || k.indexOf(key + 'gesehen:') === 0) localStorage.removeItem(k); });
    } catch (e) {}
    history.replaceState(null, '', location.pathname + location.search);
    location.reload();
  });
  document.addEventListener('click', function (ev) {
    var a = ev.target.closest && ev.target.closest('a[href^="#"]');
    if (!a || ev.defaultPrevented || ev.button !== 0 || ev.metaKey || ev.ctrlKey || ev.shiftKey) return;
    var id = decodeURIComponent(a.getAttribute('href').slice(1));
    var el = id && document.getElementById(id);
    var st = el && el.closest('.schritt');
    var versteckt = st && !st.classList.contains('aktiv') && !st.closest('.modul').classList.contains('alle');
    if (!el || !el.closest('.modul') || !versteckt && el.closest('.modul.aktiv') === el.closest('.modul') && el !== el.closest('.modul')) return;
    ev.preventDefault(); ev.stopPropagation();
    history.pushState(null, '', '#' + id);
    route();
  }, true);
  window.addEventListener('hashchange', route);
  window.addEventListener('popstate', route);
  try { if (localStorage.getItem(key + 'alle')) alleSchritte(true); } catch (e) {}
  document.querySelectorAll('.gesamtskript').forEach(function (g) {
    if (!gesamt.length) return;
    var a = document.createElement('a'); a.className = 'gs-btn'; a.textContent = 'Gesamtskript ↓';
    a.download = 'gesamtskript.R';
    a.href = URL.createObjectURL(new Blob([gesamtSkript()], { type: 'text/plain' }));
    g.appendChild(a);
  });
  update();
  route();
})();
</script>
